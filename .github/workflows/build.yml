name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Vosk model into assets
        run: |
          mkdir -p app/src/main/assets
          cd /tmp
          echo "Downloading Vosk small English model (~40MB)..."
          wget -q --show-progress https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -O model.zip
          cp model.zip $GITHUB_WORKSPACE/app/src/main/assets/model-small-en-us.zip
          echo "Model size: $(du -sh $GITHUB_WORKSPACE/app/src/main/assets/model-small-en-us.zip)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatTranslate-v3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
