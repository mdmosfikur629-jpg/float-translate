plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.floattranslate.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.floattranslate.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libvosk.so'
        pickFirst 'lib/armeabi-v7a/libvosk.so'
        pickFirst 'lib/x86/libvosk.so'
        pickFirst 'lib/x86_64/libvosk.so'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Vosk offline speech recognition (no Google app needed)
    implementation 'com.alphacephei:vosk-android:0.3.47'

    // ML Kit Language Identification
    implementation 'com.google.mlkit:language-id:17.0.4'

    // ML Kit Translation
    implementation 'com.google.mlkit:translate:17.0.1'
}
